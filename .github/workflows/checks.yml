name: PR checks

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  checks:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Block data files, secrets, venvs, and large files
        run: |
          bad=$(git ls-files | grep -E '^data/|^Data/|^\.?venv[^/]*/|(^|/)(train|test|sample_submission)\.csv$|\.zip$|(^|/)kaggle\.json$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed:"
            echo "$bad"
            echo "Remove them with: git rm -r --cached <file>"
            exit 1
          fi

          big=$(git ls-files -z | xargs -0 -I{} find {} -maxdepth 0 -type f -size +10M)
          if [ -n "$big" ]; then
            echo "::error::Files over 10 MB are not allowed:"
            echo "$big"
            exit 1
          fi

      - name: Check notebooks have no outputs
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          bad = []
          for nb in pathlib.Path(".").rglob("*.ipynb"):
              if ".ipynb_checkpoints" in nb.parts:
                  continue
              cells = json.loads(nb.read_text(encoding="utf-8")).get("cells", [])
              if any(c.get("outputs") or c.get("execution_count")
                     for c in cells if c.get("cell_type") == "code"):
                  bad.append(str(nb))
          if bad:
              print("::error::These notebooks still have outputs:")
              print("\n".join(bad))
              print("Fix: run `nbstripout --install` once, then `nbstripout <notebook>` and commit.")
              sys.exit(1)
          print("All notebooks are clean.")
          EOF

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check shared code compiles and imports
        run: |
          if [ -d src ]; then
            python -m compileall -q src
            for f in src/*.py; do
              mod=$(basename "$f" .py)
              if [ "$mod" != "__init__" ]; then
                python -c "import src.$mod"
              fi
            done
          fi

  merge:
    needs: checks
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge this branch's PR now that checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The auto-PR workflow runs at the same time, so give it a moment.
          pr=""
          for i in 1 2 3 4 5 6; do
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main \
                   --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then break; fi
            echo "No PR yet, waiting..."
            sleep 10
          done

          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH; nothing to merge."
            exit 0
          fi

          gh pr ready "$pr" --repo "$REPO" || true
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$SHA"
